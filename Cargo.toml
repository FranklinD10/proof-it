[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
regex = "1.13"
tempfile = "3.27"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
